<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Login - ShopEasy</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            🛍️ ShopEasy
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="cart.html">
                🛒 Cart
                <span id="cart-count">0</span>
            </a>

            <a href="register.html">
                Register
            </a>

        </nav>

    </header>


    <!-- Login -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Welcome Back
            </h1>

            <p class="auth-subtitle">
                Login to your ShopEasy account
            </p>


            <form id="login-form">

                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="login-email"
                    placeholder="Enter your email"
                    required>


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="login-password"
                    placeholder="Enter your password"
                    required>


                <button
                    type="submit"
                    class="auth-btn">

                    Login

                </button>

            </form>


            <p
                id="login-message"
                class="auth-message">
            </p>


            <p class="auth-link">

                Don't have an account?

                <a href="register.html">
                    Create Account
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
