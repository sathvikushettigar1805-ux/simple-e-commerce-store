<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Register - ShopEasy</title>

    <link
        rel="stylesheet"
        href="css/style.css">

</head>

<body>


    <!-- Navigation -->

    <header class="navbar">

        <div class="logo">
            🛍️ ShopEasy
        </div>

        <nav>

            <a href="index.html">
                Home
            </a>

            <a href="cart.html">
                🛒 Cart
                <span id="cart-count">0</span>
            </a>

            <a href="login.html">
                Login
            </a>

        </nav>

    </header>


    <!-- Register -->

    <main class="auth-page">

        <div class="auth-card">

            <h1>
                Create Account
            </h1>

            <p class="auth-subtitle">
                Join ShopEasy today
            </p>


            <form id="register-form">

                <label>
                    Full Name
                </label>

                <input
                    type="text"
                    id="register-name"
                    placeholder="Enter your name"
                    required>


                <label>
                    Email
                </label>

                <input
                    type="email"
                    id="register-email"
                    placeholder="Enter your email"
                    required>


                <label>
                    Password
                </label>

                <input
                    type="password"
                    id="register-password"
                    placeholder="Create a password"
                    required
                    minlength="6">


                <button
                    type="submit"
                    class="auth-btn">

                    Create Account

                </button>

            </form>


            <p
                id="register-message"
                class="auth-message">
            </p>


            <p class="auth-link">

                Already have an account?

                <a href="login.html">
                    Login
                </a>

            </p>

        </div>

    </main>


    <footer>

        <p>
            © 2026 ShopEasy. All Rights Reserved.
        </p>

    </footer>


    <script src="js/auth.js"></script>

</body>

</html>
